name: Publish image

# The publish waits for CI. An image tag stands for good, so a commit
# that fails the test suite must never carry a version number.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

# One publish at a time, and never a cancelled one: two runs would push
# the moving tags in an order nobody chose.
concurrency:
  group: publish-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/texttile-blog/texttile
  # The commit CI passed on. A workflow_run event points the workspace at
  # the head of the branch, which is not always that commit.
  COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  publish:
    # A finished CI run also reports pull requests and failures. Only a
    # green push on main gets past this line. A hand-started run says the
    # person starting it stands for the build.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      # write on contents sets the version tag, read on pull requests
      # finds the label that says how far to count
      contents: write
      packages: write
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.exact }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
          # the version comes from the tags, so the checkout needs them
          fetch-depth: 0

      # The version of a build is the Git tag v<version> on its commit,
      # and this step sets it. No pull request carries a number: every
      # build counts one step up from the newest tag, the patch number
      # unless the pull request is labeled "minor" or "major". A commit
      # that is tagged already keeps its number, so a re-run of a failed
      # build finishes the same version instead of burning the next one.
      # Settings shows this number, and the image tags carry it.
      - name: Decide the version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pattern='v[0-9]*.[0-9]*.[0-9]*'
          version="$(git tag --list "$pattern" --points-at "$COMMIT" --sort=-v:refname | head -n 1)"

          if [[ -n "$version" ]]; then
            echo "Commit $COMMIT carries $version already."
          else
            last="$(git tag --list "$pattern" --sort=-v:refname | head -n 1)"
            if [[ ! "$last" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "No version tag to count from: '$last'"
              exit 1
            fi
            major="${BASH_REMATCH[1]}" minor="${BASH_REMATCH[2]}" patch="${BASH_REMATCH[3]}"

            # The pull request the commit was merged from, if any. A
            # direct push has none and counts as a repair.
            labels="$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT/pulls" --jq '.[].labels[].name')"
            if grep -qx major <<<"$labels"; then
              version="v$((major + 1)).0.0"
            elif grep -qx minor <<<"$labels"; then
              version="v$major.$((minor + 1)).0"
            else
              version="v$major.$minor.$((patch + 1))"
            fi

            echo "$last -> $version"
            git tag "$version" "$COMMIT"
            git push origin "$version"
          fi

          version="${version#v}"
          echo "exact=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The exact tag never moves, so it must not exist yet. A re-run
      # of a commit whose image is published stops here; a re-run whose
      # build failed before the push gets past it and finishes.
      #
      # Only the registry's own word for "there is no such tag" lets the
      # build go on. Any other failure - the registry is down, the login
      # is refused - says nothing about the tag, and going on would push
      # a standing version over a build that owns it.
      - name: Refuse a version that is already published
        shell: bash
        run: |
          version="${{ steps.version.outputs.exact }}"

          if said="$(docker buildx imagetools inspect "$IMAGE:$version" 2>&1)"; then
            echo "Version $version is published already."
            exit 1
          fi

          if ! grep -qiE "not found|unknown" <<< "$said"; then
            echo "The registry did not answer whether $version exists:"
            echo "$said"
            exit 1
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            TEXTTILE_VERSION=${{ steps.version.outputs.exact }}
          # Two tags stand still, three move: the exact version and the
          # commit name one build for good, while the minor, the major
          # and latest follow the newest build that fits them.
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.exact }}
            ${{ env.IMAGE }}:${{ steps.version.outputs.minor }}
            ${{ env.IMAGE }}:${{ steps.version.outputs.major }}
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.COMMIT }}

  # The release is the version's public record on GitHub: it stands on
  # the tag v<version> the publish set, and its notes name the pull
  # requests since the release before. It is a job of its
  # own so a failed release does not read as a failed image, and
  # "re-run failed jobs" repeats only this part while the image check
  # above stops a full re-run.
  release:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}

      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.publish.outputs.version }}"
          tag="v$version"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists already."
            exit 0
          fi

          notes="$(printf '```\ndocker pull %s:%s\n```' "$IMAGE" "$version")"

          gh release create "$tag" \
            --target "$COMMIT" \
            --notes "$notes" \
            --generate-notes

  staging:
    name: Deploy staging to Bunny
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Bunny CLI
        run: npm install --global @bunny.net/cli@0.19.0
      - name: Check deployment safeguards
        run: |
          sh -n scripts/start-bunny.sh
          python3 -m unittest discover -s test/deployment
      - name: Deploy the published commit and verify its volume
        run: python3 scripts/deploy-bunny.py --image-tag "$COMMIT"
        env:
          BUNNYNET_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}
